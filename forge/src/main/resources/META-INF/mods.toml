modLoader = "javafml" #mandatory
loaderVersion = "[0,)" #mandatory
license = "${mod_license}"
issueTrackerURL = "${issues_url}"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    logoFile="${mod_id}_banner.png"
    authors = "${mod_author}"
    description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[26.1, 26.2)"
    ordering = "NONE"
    side = "BOTH"