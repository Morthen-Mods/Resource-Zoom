modLoader = "javafml" #mandatory
loaderVersion = "[4,)" #mandatory
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    logoFile="${mod_id}_banner.png"
    authors = "${mod_author}"
    description = '''${mod_description}'''

[[mixins]]
    config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type="required"
    versionRange = "[26.1, 26.2)"
    ordering = "NONE"
    side = "BOTH"
